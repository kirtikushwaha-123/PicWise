<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}PicWise — Dashboard{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  </head>
  <body class="{% block body_class %}app-shell{% endblock %}">
    {% block shell %}
      <!-- 1. SIDEBAR -->
      <aside class="sidebar" aria-label="Sidebar Navigation">
        <a class="brand" href="/" aria-label="PicWise home">
          <div class="brand-logo">
            <svg viewBox="0 0 24 24">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
              <path d="M9 12l2 2 4-4"/>
            </svg>
          </div>
          <span class="brand-name">PicWise</span>
        </a>

        <ul class="nav-list">
          <li class="nav-item {{ 'active' if active_page == 'dashboard' else '' }}">
            <a href="/" {% if active_page == 'dashboard' %}aria-current="page"{% endif %}>
              <svg viewBox="0 0 24 24">
                <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1V9.5z"/>
              </svg>
              Dashboard
            </a>
          </li>
          <li class="nav-item {{ 'active' if active_page == 'scan' else '' }}">
            <a href="/upload" {% if active_page == 'scan' %}aria-current="page"{% endif %}>
              <svg viewBox="0 0 24 24">
                <path d="M3 8V5a2 2 0 0 1 2-2h3"/>
                <path d="M16 3h3a2 2 0 0 1 2 2v3"/>
                <path d="M21 16v3a2 2 0 0 1-2 2h-3"/>
                <path d="M8 21H5a2 2 0 0 1-2-2v-3"/>
                <line x1="8" y1="12" x2="16" y2="12" stroke-linecap="round"/>
              </svg>
              Scan Product
            </a>
          </li>
          <li class="nav-item {{ 'active' if active_page == 'history' else '' }}">
            <a href="#">
              <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="9"/>
                <polyline points="12 7 12 12 15 15"/>
              </svg>
              History
            </a>
          </li>
          <li class="nav-item {{ 'active' if active_page == 'allergens' else '' }}">
            <a href="#">
              <svg viewBox="0 0 24 24">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
              </svg>
              My Allergens
            </a>
          </li>
          <li class="nav-item {{ 'active' if active_page == 'insights' else '' }}">
            <a href="#">
              <svg viewBox="0 0 24 24">
                <line x1="18" y1="20" x2="18" y2="10"/>
                <line x1="12" y1="20" x2="12" y2="4"/>
                <line x1="6" y1="20" x2="6" y2="14"/>
                <line x1="2" y1="20" x2="22" y2="20"/>
              </svg>
              Insights
            </a>
          </li>
          <li class="nav-item {{ 'active' if active_page == 'settings' else '' }}">
            <a href="#">
              <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="3"/>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
              </svg>
              Settings
            </a>
          </li>
        </ul>

        <div class="nav-divider"></div>

        <a class="support-link" href="#">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="9"/>
            <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
            <line x1="12" y1="17" x2="12.01" y2="17" stroke-width="2.5" stroke-linecap="round"/>
          </svg>
          Help & Support
        </a>

        <div class="sidebar-bottom-card">
          <div class="sidebar-bottom-badge">
            <svg viewBox="0 0 24 24">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
              <path d="M9 12l2 2 4-4"/>
            </svg>
          </div>
          <p class="sidebar-bottom-title">
            Your <span class="highlight-safety">safety</span>, our <span class="highlight-priority">priority</span>.
          </p>
          <p class="sidebar-bottom-desc">
            PicWise helps you make safer choices, every day.
          </p>
        </div>
      </aside>

      <!-- 2. MAIN AREA -->
      <div class="main-area">
        <header class="topbar">
          <button class="notification-btn" type="button" aria-label="View notifications">
            <svg viewBox="0 0 24 24">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
            </svg>
            <span class="notification-dot"></span>
          </button>

          <a class="user-profile" href="/login" aria-label="User menu for Amisha">
            <div class="avatar-img" aria-hidden="true">
              <svg viewBox="0 0 36 36" fill="none">
                <circle cx="18" cy="18" r="18" fill="#FDE047"/>
                <path d="M18 7C14.134 7 11 10.134 11 14C11 17.866 14.134 21 18 21C21.866 21 25 17.866 25 14C25 10.134 21.866 7 18 7Z" fill="#3B2E2A"/>
                <ellipse cx="18" cy="14.5" rx="5.5" ry="6.5" fill="#FED7AA"/>
                <circle cx="16" cy="14" r="0.8" fill="#3B2E2A"/>
                <circle cx="20" cy="14" r="0.8" fill="#3B2E2A"/>
                <path d="M17 17C17.5 17.5 18.5 17.5 19 17" stroke="#3B2E2A" stroke-width="0.8" stroke-linecap="round"/>
                <path d="M13 11.5C13 11.5 14.5 9.5 18 9.5C21.5 9.5 23 11.5 23 11.5" stroke="#3B2E2A" stroke-width="1.8" stroke-linecap="round"/>
                <path d="M8.5 31C8.5 25.4772 12.7533 21 18 21C23.2467 21 27.5 25.4772 27.5 31" fill="#2F6FED"/>
              </svg>
            </div>
            <span class="user-name">Hi, Amisha</span>
            <svg class="user-chevron" viewBox="0 0 24 24">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </a>
        </header>

        <main class="content-area">
          <div class="content-container">
            {% block content %}{% endblock %}
          </div>
        </main>
      </div>
    {% endblock %}
  </body>
</html>
